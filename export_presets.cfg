[preset.0]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="assets/licenses/*.txt,assets/licenses/*.json"
exclude_filter="docs/*,tests/*,tools/*,initial_task.md,*.md"
export_path="builds/beaver-mayhem-debug.apk"

[preset.0.options]
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=2
version/name="0.2.0"
package/unique_name="org.canislegatus.beavermayhem"
package/name="Beaver Mayhem"
package/signed=true
screen/immersive_mode=true
permissions/internet=false

launcher_icons/main_192x192="res://assets/images/beaver-icon.png"
launcher_icons/adaptive_foreground_432x432="res://assets/images/beaver-icon.png"
launcher_icons/adaptive_background_432x432="res://assets/images/beaver-icon.png"
launcher_icons/adaptive_monochrome_432x432="res://assets/images/beaver-monochrome.svg"
